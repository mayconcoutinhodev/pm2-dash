<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fundo arredondado escuro -->
  <rect width="32" height="32" rx="7" fill="#0d1117"/>
  <!-- Tela do monitor -->
  <rect x="3" y="5" width="26" height="18" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <!-- Seta do terminal ">" -->
  <path d="M7 13 L12 16 L7 19" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Cursor "_" -->
  <line x1="14" y1="19" x2="21" y2="19" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>
  <!-- Ponto verde de status (canto superior direito) -->
  <circle cx="27" cy="7" r="3" fill="#3fb950"/>
  <!-- Base do monitor -->
  <rect x="13" y="23" width="6" height="3" rx="1" fill="#30363d"/>
  <rect x="10" y="26" width="12" height="2" rx="1" fill="#30363d"/>
</svg>
